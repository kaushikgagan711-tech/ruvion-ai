function planCard(name,price,desc,features,label,featured=false){let current=(name==='Pro'&&data.entitlement==='pro')||(name==='Plus'&&data.entitlement==='plus')||(name==='Free'&&data.entitlement==='free');let suffix=price.includes('for 6 months')?'':(name==='Student Plus'?'<span class="per"> / 6 months</span>':price!=='₹0'?'<span class="per"> / month</span>':'');return `<article class="plan ${featured?'featured':''}"><span class="plan-label">${featured?'MOST POPULAR':''}</span><h3>${name}</h3><div class="price">${price}${suffix}</div><p>${desc}</p><ul>${features.map(x=>`<li>${x}</li>`).join('')}</ul><button class="button ${featured?'accent':''}" data-plan="${name}" ${current?'disabled':''}>${current?'Current plan':label}</button></article>`}

>Test connection</button><button class="button accent" id="saveConnection">Save connection</button></div>`}

 $('#profileBtn')?.addEventListener('click',()=>openDialog('settings'));
 $('#newChat').onclick=newChat; $('#memoryBtn').onclick=()=>openDialog('memory'); $('#plansBtn').onclick=()=>openDialog('plans'); $('#settingsBtn').onclick=()=>openDialog('settings'); $('#searchChats').onclick=()=>openDialog('search'); $('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open'); $('#exportBtn').onclick=()=>exportChat(active()); $('#chatMenu').onclick=(e)=>{let p=$('.popover');if(p)p.remove();else{let d=document.createElement('div');d.className='popover';d.innerHTML='<button data-menu-action="rename">Rename chat</button><button data-menu-action="delete" style="color:#ffadb4">Delete chat</button>';$('.main').append(d)}};
 $$('.chat-row').forEach(b=>b.onclick=()=>{data.active=b.dataset.chat;save();render()}); $$('.suggestion').forEach(b=>b.onclick=()=>{const c=$('#composer');c.value=b.dataset.prompt;autoSize(c);updateSend();c.focus()});

function bindSettings(){ $('#saveConnection')?.addEventListener('click',()=>{data.settings.apiUrl=$('#apiUrl').value.trim();save();$('#connectionStatus').className='status '+(data.settings.apiUrl?'ok':'warn');$('#connectionStatus').textContent=data.settings.apiUrl?'Endpoint configured for this device.':'No AI endpoint configured.';toast('Connection settings saved')});$('#testConnection')?.addEventListener('click',testConnection);$('#exportData')?.addEventListener('click',exportData);$('#importData')?.addEventListener('change',importData)}
function profileSettingsPanel(){return `<h3>Profile</h3><p>This name is saved locally in RUVION's application data and is available in every chat.</p><div class="form-row"><label>Name</label><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#191d25;border:1px solid #343a47;border-radius:9px;padding:10px 11px"><span>${esc(profile.displayName)}</span><button class="button" id="changeName">Change name</button></div></div><div class="status ok">Local Profile · ${esc(initials(profile.displayName))}</div>`}

function autoSize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,180)+'px'}function updateSend(){$('#sendBtn').disabled=!$('#composer').value.trim()&&!editing}
function newChat(){let c={id:uid(),title:'New conversation',created:Date.now(),messages:[]};data.chats.unshift(c);data.active=c.id;attachments=[];editing=null;save();render();$('#composer').focus()}
function openDialog(n){menuOpen=false;activeDialog=n;render();setTimeout(()=>$('#searchInput')?.focus(),10)}function closeDialog(){activeDialog=null;render()}
function plusAction(kind){menuOpen=false;if(kind==='file')$('#fileInput').click();else if(kind==='image')$('#imageInput').click();else if(kind==='camera')takePhoto();else if(kind==='imagegen'||kind==='videogen'){$('#composer').value=`${kind==='imagegen'?'Generate an image of ':'Create a video of '}`;autoSize($('#composer'));updateSend();$('#composer').focus();toast(`${kind==='imagegen'?'Image':'Video'} generation will use your configured provider.`)}render()}
$('#fileInput').onchange=e=>addFiles([...e.target.files]);$('#imageInput').onchange=e=>addFiles([...e.target.files].filter(file=>file.type.startsWith('image/')));
function addFiles(files){for(const file of files){if(file.size>20*1024*1024){toast(`${file.name} is larger than 20 MB`);continue}let a={id:uid(),name:file.name,type:file.type,size:file.size,file};if(file.type.startsWith('image/'))a.url=URL.createObjectURL(file);attachments.push(a)}render();toast(files.length?'Attachment added':'')}
async function takePhoto(){if(!navigator.mediaDevices?.getUserMedia){toast('Camera is not available in this browser');return}try{let stream=await navigator.mediaDevices.getUserMedia({video:true});let video=document.createElement('video');video.srcObject=stream;await video.play();let canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);stream.getTracks().forEach(t=>t.stop());canvas.toBlob(blob=>addFiles([new File([blob],'ruvion-photo.jpg',{type:'image/jpeg'})]));}catch{toast('Camera permission was not granted')}}
function pasteImage(e){let item=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(item){e.preventDefault();addFiles([new File([item.getAsFile()],'pasted-image.png',{type:item.type})])}}
async function send(){const input=$('#composer'),text=input.value.trim();if(!text&&!attachments.length)return;const chat=active();if(editing){let idx=chat.messages.findIndex(m=>m.id===editing);if(idx>-1)chat.messages.splice(idx);editing=null}let m={id:uid(),role:'user',text,attachments:attachments.map(({id,name,type,size,url})=>({id,name,type,size,url})),created:Date.now()};chat.messages.push(m);chat.title=chat.messages.filter(x=>x.role==='user')[0]?.text?titleFor(chat.messages.filter(x=>x.role==='user')[0].text):chat.title;attachments=[];input.value='';autoSize(input);save();render();await getReply(chat,m)}
function imageRequest(text){return /\b(gen\w*|creat\w*|mak\w*)\b.*\b(image|picture|illustration|artwork|photo)\b/i.test(text)}
function intentStatus(text){if(imageRequest(text))return 'RUVION will create this image through its secure server-side image service.';if(/\b(gen\w*|creat\w*|mak\w*)\b.*\b(video|animation)\b/i.test(text))return 'Video generation needs a configured provider with enabled video access and billing.';if(/\b(search|latest|today|news)\b/i.test(text))return 'RUVION can research current information in the background when available.';return ''}
async function getReply(chat,user){let thinking={id:uid(),role:'assistant',text:'',created:Date.now(),pending:true};chat.messages.push(thinking);save();render();let reply='',status='';try{if(!data.settings.apiUrl)throw new Error('NO_ENDPOINT');const payload={messages:chat.messages.filter(m=>!m.pending).map(m=>({role:m.role,content:m.text,attachments:m.attachments?.map(a=>({name:a.name,type:a.type}))})),model:data.settings.model,metadata:{app:'RUVION',creator:'Gagan Kaushik Sammeta'}};const res=await fetch(data.settings.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error('HTTP_'+res.status);let type=res.headers.get('content-type')||'';if(type.includes('application/json')){let out=await res.json();reply=out.text||out.reply||out.message||''}else reply=await res.text();if(!reply)throw new Error('EMPTY')}catch(e){if(e.message==='NO_ENDPOINT'){reply=`I’m ready to help, but this RUVION installation isn’t connected to a secure AI provider yet. Open Settings → Connection to add your server-side RUVION endpoint. Your API key should stay on that server, never in the browser.`;status=intentStatus(user.text)}else{reply=`I couldn’t reach the configured RUVION provider. Please check the secure endpoint in Settings and try again.`;status='The message remains saved locally, so you can resend it after the connection is available.'}}thinking.pending=false;thinking.text=reply;thinking.status=status;save();render()}
function messageAction(action,id){let chat=active(),m=chat.messages.find(x=>x.id===id);if(!m)return;if(action==='copy'){navigator.clipboard?.writeText(m.text);toast('Copied to clipboard')}else if(action==='edit'){editing=id;render();$('#composer').focus()}else if(action==='resend'){let c=$('#composer');c.value=m.text;autoSize(c);updateSend();c.focus()}else if(action==='regen'){let index=chat.messages.findIndex(x=>x.id===id),previous=[...chat.messages.slice(0,index)].reverse().find(x=>x.role==='user');if(previous){chat.messages.splice(index,1);save();render();getReply(chat,previous)}}}

function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

// Keep the reading position stable. Only a newly sent/re-generated message is
// allowed to follow the stream to the bottom; browsing older messages never jumps.
(() => {
  const nativeRAF = window.requestAnimationFrame.bind(window);
  let followStream = false;
  let followTimer;
  const startFollowing = () => {
    followStream = true;
    clearTimeout(followTimer);
    followTimer = setTimeout(() => { followStream = false; }, 45000);
  };
  window.requestAnimationFrame = callback => nativeRAF(() => { if (followStream) callback(); });
  document.addEventListener('click', event => {
    if (event.target.closest('#sendBtn') || event.target.closest('[data-action="regen"]')) startFollowing();
    if (event.target.closest('[data-chat]')) followStream = false;
  }, true);
  document.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey || !event.shiftKey) && event.key === 'Enter' && event.target?.id === 'composer') startFollowing();
  }, true);
})();

// A direct, accessible delete control on every saved chat. The original menu
// remains available too, but deleting a chat should never be hard to discover.
(() => {
  const installDeleteControls = () => {
    document.querySelectorAll('.chat-row[data-chat]').forEach(row => {
      if (row.querySelector('[data-quick-delete]')) return;
      const remove = document.createElement('span');
      remove.className = 'chat-dots';
      remove.dataset.quickDelete = row.dataset.chat;
      remove.setAttribute('role', 'button');
      remove.setAttribute('tabindex', '0');
      remove.setAttribute('aria-label', 'Delete chat');
      remove.title = 'Delete chat';
      remove.innerHTML = icon('trash');
      const deleteCurrent = event => {
        event.preventDefault();
        event.stopPropagation();
        const chat = data.chats.find(item => item.id === remove.dataset.quickDelete);
        if (!chat) return;
        if (data.chats.length === 1) return toast('Keep at least one chat');
        if (confirm(`Delete “${chat.title}”?`)) {
          data.chats = data.chats.filter(item => item.id !== chat.id);
          data.active = data.chats[0].id;
          save();
          render();
        }
      };
      remove.addEventListener('click', deleteCurrent);
      remove.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') deleteCurrent(event); });
      row.append(remove);
    });
  };
  new MutationObserver(installDeleteControls).observe(document.getElementById('app'), {childList:true, subtree:true});
  installDeleteControls();
})();

// Reference photos stay only in memory for the current generation request.
// They are not written to local chat history or the native profile file.
const ruvionReferenceImages = new Map();
function photoGuidedImageRequest(text, references) {
  return references.length > 0 && /\b(put|place|make|create|generate|show|turn|transform|edit|wear)\b/i.test(text);
}
function encodeReferencePhoto(attachment) {
  return new Promise((resolve, reject) => {
    if (!attachment.file || !attachment.type.startsWith('image/')) return resolve(null);
    if (attachment.file.size > 6_000_000) return reject(new Error('Reference photos must be 6 MB or smaller.'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('RUVION could not read that photo.'));
    reader.onload = () => {
      const value = String(reader.result || '');
      const comma = value.indexOf(',');
      resolve(comma > -1 ? { mimeType: attachment.type, data: value.slice(comma + 1) } : null);
    };
    reader.readAsDataURL(attachment.file);
  });
}
send = async function() {
  const input = $('#composer'), text = input.value.trim();
  if (!text && !attachments.length) return;
  const chat = active();
  let references;
  try { references = (await Promise.all(attachments.filter(item => item.type.startsWith('image/')).map(encodeReferencePhoto))).filter(Boolean); }
  catch (error) { toast(error.message); return; }
  if (editing) { const index = chat.messages.findIndex(item => item.id === editing); if (index > -1) chat.messages.splice(index); editing = null; }
  const message = { id: uid(), role: 'user', text, attachments: attachments.map(({id,name,type,size,url}) => ({id,name,type,size,url})), created: Date.now() };
  if (references.length) ruvionReferenceImages.set(message.id, references);
  chat.messages.push(message);
  chat.title = chat.messages.filter(item => item.role === 'user')[0]?.text ? titleFor(chat.messages.filter(item => item.role === 'user')[0].text) : chat.title;
  attachments = []; input.value = ''; autoSize(input); save(); render(); await getReply(chat, message);
};
getReply = async function(chat, user) {
  const response = {id:uid(), role:'assistant', text:'', created:Date.now(), pending:true};
  const references = ruvionReferenceImages.get(user.id) || [];
  chat.messages.push(response); save(); render();
  const finish = (text, status = '') => { response.pending = false; response.text = text; response.status = status; ruvionReferenceImages.delete(user.id); save(); render(); };
  try {
    const generateImage = imageRequest(user.text) || photoGuidedImageRequest(user.text, references);
    const payload = {messages:chat.messages.filter(message => !message.pending).map(message => ({role:message.role,content:message.text})), model:data.settings.model, generateImage, referenceImages:references, deviceId:profile.profileId, userProfile:{profileId:profile.profileId,displayName:profile.displayName},metadata:{app:'RUVION',creator:'Gagan Kaushik Sammeta'}};
    const result = await fetch(window.RUVION_API_URL, {method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},body:JSON.stringify(payload)});

    const reader = result.body?.getReader(); if (!reader) throw new Error('The public service did not return a readable stream.');
    const decoder = new TextDecoder(); let buffer='', text='';
    while (true) { const {value,done} = await reader.read(); if (done) break; buffer += decoder.decode(value,{stream:true}); const events=buffer.split('\n\n'); buffer=events.pop()||''; for (const event of events) { const line=event.split('\n').find(item=>item.startsWith('data: ')); if(!line) continue; const chunk=JSON.parse(line.slice(6)); if(chunk.delta){text+=chunk.delta;response.text=text;response.pending=false;} if(chunk.image) response.imageData=chunk.image; if(chunk.delta||chunk.image) render(); if(chunk.error) throw new Error(chunk.error); } }

  const imageHTML=message.imageData?`<img src="${message.imageData}" alt="RUVION generated image" style="display:block;max-width:min(100%,640px);max-height:640px;border-radius:14px;border:1px solid #303846;margin-top:12px"/>`:'';
  const videoHTML=message.videoData?`<video controls playsinline src="${message.videoData}" style="display:block;width:min(100%,640px);max-height:640px;border-radius:14px;border:1px solid #303846;margin-top:12px;background:#000">Your browser cannot play this RUVION-generated video.</video>`:'';
  const body=message.pending?`<div class="tool-status"><span class="spinner"></span>RUVION is thinking...</div>`:`<div class="message-text">${formatText(message.text)}</div>${imageHTML}${videoHTML}${message.status?`<div class="notice">${esc(message.status)}</div>`:''}`;
  return `<article class="message ${message.role}" data-message="${message.id}">${message.role==='assistant'?`<div class="message-avatar">${nova}</div>`:''}<div class="message-body">${message.role==='assistant'?'<div class="message-meta">RUVION</div>':''}${attachmentsHTML}${body}${message.pending?'':`<div class="message-actions">${message.role==='assistant'?`<button data-action="copy" data-id="${message.id}">${icon('copy')} Copy</button><button data-action="regen" data-id="${message.id}">↻ Regenerate</button>`:`<button data-action="edit" data-id="${message.id}">${icon('edit')} Edit</button><button data-action="copy" data-id="${message.id}">${icon('copy')} Copy</button><button data-action="resend" data-id="${message.id}">↗ Resend</button>`}</div>`}</div></article>`;
};
getReply = async function(chat, user) {
  const response={id:uid(),role:'assistant',text:'',created:Date.now(),pending:true};
  const references=ruvionReferenceImages.get(user.id)||[], files=ruvionEphemeralFiles.get(user.id)||[];
  chat.messages.push(response);save();render();
  const finish=(text,status='')=>{response.pending=false;response.text=text;response.status=status;ruvionReferenceImages.delete(user.id);ruvionEphemeralFiles.delete(user.id);save();render();};
  try {
    const generateVideo=videoRequest(user.text);
    const generateImage=!generateVideo&&(imageRequest(user.text)||photoGuidedImageRequest(user.text,references));
    const payload={messages:chat.messages.filter(message=>!message.pending).map(message=>({role:message.role,content:message.text})),model:data.settings.model,mode:data.settings.model,generateImage,generateVideo,referenceImages:references,files,deviceId:profile.profileId,userProfile:{profileId:profile.profileId,displayName:profile.displayName},metadata:{app:'RUVION',creator:'Gagan Kaushik Sammeta'}};
    const result=await fetch(window.RUVION_API_URL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},body:JSON.stringify(payload)});
    if(!result.ok){let detail='';try{detail=(await result.json()).error?.message||'';}catch{}return finish(`RUVION couldn’t complete that request. ${detail||'The public RUVION service is unavailable.'}`,'No API key or setup is needed in the desktop app.');}
    const reader=result.body?.getReader();if(!reader)throw new Error('The public service did not return a readable stream.');const decoder=new TextDecoder();let buffer='',text='';
    while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){const line=event.split('\n').find(item=>item.startsWith('data: '));if(!line)continue;const chunk=JSON.parse(line.slice(6));if(chunk.delta){text+=chunk.delta;response.text=text;response.pending=false;}if(chunk.image)response.imageData=chunk.image;if(chunk.video)response.videoData=chunk.video;if(chunk.delta||chunk.image||chunk.video)render();if(chunk.error)throw new Error(chunk.error);}}
    finish(text||'RUVION returned no media for this request.',text?'':'Please try again later.');
  }catch(error){finish(`RUVION couldn’t complete that request. ${error.message||'The public service is unavailable.'}`,'No API key or setup is needed in the desktop app.');}
};

// Keep deletion outside the chat-selection button. Nested controls are unreliable
// in WKWebView, so every saved conversation gets a separate visible trash button.
const ruvionBaseRender = render;
let ruvionPendingDelete = '';
render = function() {
  ruvionBaseRender();
  document.querySelectorAll('.chat-row[data-chat]').forEach(row => {
    if (row.parentElement?.classList.contains('chat-entry')) return;
    const entry = document.createElement('div');
    entry.className = 'chat-entry';
    row.parentNode.insertBefore(entry, row);
    entry.append(row);
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'chat-delete-button';
    remove.dataset.deleteChat = row.dataset.chat;
    remove.setAttribute('aria-label', 'Delete chat');
    remove.title = 'Delete chat';
    remove.innerHTML = icon('trash');
    remove.onclick = event => {
      event.preventDefault();
      event.stopPropagation();
      const chat = data.chats.find(item => item.id === remove.dataset.deleteChat);
      if (!chat) return;
      if (data.chats.length === 1) return toast('Keep at least one chat');
      if (ruvionPendingDelete !== chat.id) {
        ruvionPendingDelete = chat.id;
        remove.textContent = 'Delete?';
        remove.setAttribute('aria-label', `Confirm delete ${chat.title}`);
        remove.title = 'Click again to delete';
        remove.style.width = '58px';
        setTimeout(() => { if (ruvionPendingDelete === chat.id) { ruvionPendingDelete = ''; render(); } }, 3500);
        return;
      }
      ruvionPendingDelete = '';
      data.chats = data.chats.filter(item => item.id !== chat.id);
      if (data.active === chat.id) data.active = data.chats[0].id;
      save();
      render();
    };
    entry.append(remove);
  });
};
const ruvionDeleteStyle = document.createElement('style');
ruvionDeleteStyle.textContent = '.chat-entry{display:flex;align-items:center;gap:3px}.chat-entry .chat-row{flex:1;width:auto}.chat-entry .chat-row .chat-dots{display:none!important}.chat-delete-button{display:grid;place-items:center;width:30px;height:30px;flex:0 0 30px;border:1px solid #3a4353;border-radius:8px;background:#202633;color:#c9d2e1;padding:5px}.chat-delete-button:hover{background:#49242b;border-color:#9a4e5a;color:#fff}.chat-delete-button .icon{width:15px;height:15px}';
document.head.append(ruvionDeleteStyle);

// Show the actual server-side device allowance, not a made-up account quota.
let ruvionRateRemaining = null;
const nativeRuvionFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const result = await nativeRuvionFetch(...args);
  const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
  if (url.includes('/v1/chat')) {
    const value = result.headers.get('X-RUVION-RateLimit-Remaining');
    const limit = result.headers.get('X-RUVION-RateLimit-Limit') || '100';
    const chatValue = result.headers.get('X-RUVION-ChatLimit-Remaining');
    if (chatValue !== null) {
      ruvionRateRemaining = `${chatValue} chats left · ${limit}/min protection`;
      const usage = document.querySelector('.ruvion-usage');
      if (usage) usage.textContent = `AI limit · ${ruvionRateRemaining}`;
    } else if (value !== null) {
      ruvionRateRemaining = `${value} left · ${limit}/min protection`;
      const usage = document.querySelector('.ruvion-usage');
      if (usage) usage.textContent = `AI limit · ${ruvionRateRemaining}`;
    }
  }
  return result;
};
const ruvionRenderWithUsage = render;
render = function() {
  ruvionRenderWithUsage();
  const footer = document.querySelector('.side-footer');
  if (!footer) return;
  let usage = footer.querySelector('.ruvion-usage');
  if (!usage) { usage = document.createElement('div'); usage.className = 'ruvion-usage'; footer.insertBefore(usage, footer.firstChild); }
  usage.textContent = ruvionRateRemaining ? `AI limit · ${ruvionRateRemaining}` : 'AI limit · checking…';
};
const ruvionUsageStyle = document.createElement('style');
ruvionUsageStyle.textContent = '.ruvion-usage{font-size:11px;color:#78859a;padding:4px 10px 8px;border-bottom:1px solid #202530;margin-bottom:4px}';
document.head.append(ruvionUsageStyle);

// Final plan copy is kept here as a single UI source so an older cached plan

// Student verification is an explicit, privacy-aware submission flow. It collects
// the ID/selfie only in memory for this review session; it never activates a plan
// locally or pretends that OCR/face matching has happened.
let studentIdFile = null, studentSelfieFile = null;
const normalizeVerificationName = value => String(value || '').trim().toLocaleLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ');
function studentVerificationDialog(){
  const prior=data.studentVerification||{};
  const status=prior.status==='pending_review'?`<div class="status warn">Student ID submitted for review. Student offers stay inactive until a verified reviewer approves it.</div>`:'';
  return `<div class="overlay" data-close><section class="dialog" style="width:min(700px,100%)"><header class="dialog-head"><div><h2>Student verification</h2><p>Upload your student ID first, then match your face or use the school-question fallback.</p></div><button class="close" data-close>${icon('x')}</button></header><div class="dialog-content"><div class="status">For privacy, files stay in this session until you submit. RUVION will not activate a student offer from a filename or an unverified upload.</div>${status}<div class="form-row"><label for="verificationName">Name printed on the student ID</label><input id="verificationName" maxlength="80" value="${esc(prior.name||profile.displayName)}" placeholder="Enter the name exactly as shown on your ID"/><span class="form-help">It must match your saved RUVION profile name: <b>${esc(profile.displayName)}</b>.</span></div><div class="form-row"><label>1. Student ID card</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="button" id="studentIdPick">${icon('upload')} Choose student ID</button><span id="studentIdLabel" class="form-help">${esc(studentIdFile?.name||prior.idName||'No ID selected')}</span></div><span class="form-help">Accepted: photo or PDF. Cover unrelated numbers before submitting if they are not needed for verification.</span><input id="studentIdFile" type="file" accept="image/*,.pdf" hidden /></div><label style="display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--soft);margin:4px 0 12px"><input id="idCardHasPhoto" type="checkbox" style="margin-top:2px" checked/>My student ID includes my photo</label><div id="faceVerificationFields" class="form-row"><label>2. Face scan / selfie</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="button" id="studentSelfieCapture">${icon('camera')} Take selfie</button><button class="button" id="studentSelfiePick">${icon('image')} Upload selfie</button><span id="studentSelfieLabel" class="form-help">${esc(studentSelfieFile?.name||prior.selfieName||'No selfie selected')}</span></div><span class="form-help">Use a clear, recent selfie with your face visible. The verification service compares it with the ID photo.</span><input id="studentSelfieFile" type="file" accept="image/*" capture="user" hidden /></div><div id="schoolQuestionFields" class="form-row" style="display:none"><label>Backup questions (used only when the ID has no photo)</label><input id="schoolName" placeholder="School or college name"/><input id="studentNumber" placeholder="Student ID or roll number"/><input id="enrollmentYear" inputmode="numeric" placeholder="Enrollment year"/><span class="form-help">Your school can confirm these details during review. Do not enter passwords or unrelated personal information.</span></div><label style="display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--soft);margin-top:8px"><input id="verificationConsent" type="checkbox" style="margin-top:2px"/>I consent to RUVION using these details and images only for student verification and understand that access is not granted until review succeeds.</label><div id="verificationStatus"></div><div class="button-row"><button class="button" data-close>Cancel</button><button class="button accent" id="submitStudentVerification">Submit for verification</button></div></div></section></div>`;
}
const uploadOnlyStudentVerificationDialog = studentVerificationDialog;
studentVerificationDialog = function(){ return uploadOnlyStudentVerificationDialog().replace('Upload your student ID first, then match your face or use the school-question fallback.','Upload your student ID for review. No driver’s license or paid face check is required.'); };
async function captureStudentSelfie(){
  if(!navigator.mediaDevices?.getUserMedia){$('#studentSelfieFile')?.click();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    const video=document.createElement('video');video.srcObject=stream;await video.play();
    const canvas=document.createElement('canvas');canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    stream.getTracks().forEach(track=>track.stop());
    canvas.toBlob(blob=>{if(blob){studentSelfieFile=new File([blob],'student-selfie.jpg',{type:'image/jpeg'});const label=$('#studentSelfieLabel');if(label)label.textContent=studentSelfieFile.name;toast('Selfie captured for this verification session')}},'image/jpeg',.9);
  }catch{$('#studentSelfieFile')?.click()}
}
function bindStudentVerification(){
  const idInput=$('#studentIdFile'), selfieInput=$('#studentSelfieFile');
  $('#studentIdPick')?.addEventListener('click',()=>idInput?.click());
  $('#studentSelfiePick')?.addEventListener('click',()=>selfieInput?.click());
  $('#studentSelfieCapture')?.addEventListener('click',captureStudentSelfie);
  idInput?.addEventListener('change',event=>{studentIdFile=event.target.files?.[0]||null;const label=$('#studentIdLabel');if(label)label.textContent=studentIdFile?.name||'No ID selected'});
  selfieInput?.addEventListener('change',event=>{studentSelfieFile=event.target.files?.[0]||null;const label=$('#studentSelfieLabel');if(label)label.textContent=studentSelfieFile?.name||'No selfie selected'});
  const hasPhoto=$('#idCardHasPhoto');
  const toggleVerificationMethod=()=>{const face=$('#faceVerificationFields'),questions=$('#schoolQuestionFields');if(face)face.style.display=hasPhoto?.checked?'':'none';if(questions)questions.style.display=hasPhoto?.checked?'none':''};
  hasPhoto?.addEventListener('change',toggleVerificationMethod);toggleVerificationMethod();
  // Upload-only student review: no paid face scan or government-ID flow.
  const faceFields=$('#faceVerificationFields'), questionFields=$('#schoolQuestionFields');
  if(faceFields) faceFields.style.display='none';
  if(questionFields) questionFields.style.display='none';
  if(hasPhoto?.closest('label')) hasPhoto.closest('label').style.display='none';
  $('#submitStudentVerification')?.addEventListener('click',async()=>{
    const name=$('#verificationName')?.value.trim()||'';const consent=$('#verificationConsent')?.checked;
    const status=$('#verificationStatus');
    if(['pending_review','approved','in_progress'].includes(data.studentVerification?.status)){if(status)status.innerHTML='<div class="status warn">This profile has already submitted a student verification. It can only be redeemed once.</div>';return}
    const hasIdPhoto=!!$('#idCardHasPhoto')?.checked;
    const questionAnswers=[$('#schoolName')?.value.trim(),$('#studentNumber')?.value.trim(),$('#enrollmentYear')?.value.trim()];
    if(!name||!studentIdFile||!consent){if(status)status.innerHTML='<div class="status warn">Enter the ID name, upload your student ID, and accept the consent notice.</div>';return}
    if(normalizeVerificationName(name)!==normalizeVerificationName(profile.displayName)){if(status)status.innerHTML='<div class="status warn">The ID name must match your saved RUVION profile name before you can submit.</div>';return}
    const verification={status:'pending_review',method:'student_id_upload',name,idName:studentIdFile.name,selfieName:hasIdPhoto?studentSelfieFile?.name||'':'',submittedAt:new Date().toISOString()};
    data.studentVerification=verification;save();activeDialog='studentVerification';render();toast('Student ID submitted for review. No plan is activated until a verified review approves it.');
  });
}
const dialogWithStudentVerification=dialogHTML;
dialogHTML=function(){return activeDialog==='studentVerification'?studentVerificationDialog():dialogWithStudentVerification()};
const bindWithStudentVerification=bind;
bind=function(){bindWithStudentVerification();if(activeDialog==='studentVerification')bindStudentVerification()};
const planWithStudentVerification=plansDialog;
plansDialog=function(){return planWithStudentVerification().replace('Student verification coming soon','Verify with student ID + selfie').replace('Student verification coming soon','Verify student')};

// Native Work Mode actions. The native shell keeps this bridge allow-listed and
// asks for confirmation before writing files or running an Xcode build.
const ruvionWorkPending = new Map();
window.__ruvionWorkResult = function(id, result) {
  const resolve = ruvionWorkPending.get(id); if (!resolve) return;
  ruvionWorkPending.delete(id); resolve(result);
};
function nativeWork(action, payload = {}) {
  return new Promise(resolve => {
    const id = uid(); ruvionWorkPending.set(id, resolve);
    const handler = window.webkit?.messageHandlers?.ruvionWork;
    if (!handler) { ruvionWorkPending.delete(id); resolve({ok:false,error:'Native Work Mode is unavailable in this build.'}); return; }
    handler.postMessage({id, action, ...payload});
    setTimeout(() => { if (ruvionWorkPending.has(id)) { ruvionWorkPending.delete(id); resolve({ok:false,error:'Work Mode timed out.'}); } }, 120000);
  });
}
async function tryNativeWorkCommand(text) {
  if (!/^RUVION Work/i.test(data.settings.model || '')) return null;
  const open = text.match(/^(?:please\s+)?(?:open|launch)\s+(xcode|safari|chrome|terminal|textedit|finder)\s*$/i);
  if (open) {
    const bundles = {xcode:'com.apple.dt.Xcode',safari:'com.apple.Safari',chrome:'com.google.Chrome',terminal:'com.apple.Terminal',textedit:'com.apple.TextEdit',finder:'com.apple.finder'};
    const result = await nativeWork('openApp', {bundleID:bundles[open[1].toLowerCase()]});
    return result.ok ? `Opened ${open[1]}.` : `Work Mode couldn’t open it. ${result.error||''}`;
  }
  const build = text.match(/^(?:please\s+)?build\s+(.+\.xcodeproj)\s*$/i);
  if (build) {
    const result = await nativeWork('buildProject', {relativePath:build[1]});
    if (result.ok) return `Build completed for ${build[1]}.`;
    return result.cancelled ? 'Build cancelled.' : `Build failed. ${result.error||''}\n\n${result.output||''}`;
  }
  return null;
}
const ruvionNativeAwareReply = getReply;
getReply = async function(chat, user) {
  const nativeResult = await tryNativeWorkCommand(user.text.trim());
  if (nativeResult !== null) {
    const response={id:uid(),role:'assistant',text:nativeResult,created:Date.now(),pending:false};
    chat.messages.push(response); save(); render(); return;
  }
  return ruvionNativeAwareReply(chat, user);
};
